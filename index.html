<title>Cómo Llegar — Panel Administrador</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --petroleo: #135457;
    --lima:     #c4df57;
    --naranja:  #deaf4d;
    --verdecl:  #b7d6b5;
    --blanco:   #ffffff;
    --hueso:    #f5f3ec;
    --negro:    #000000;
    --error:    #c0392b;
  }
  body { margin: 0; min-height: 100vh; background: var(--petroleo); font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 24px 16px; }

  @keyframes fadeInScreen { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
  @keyframes shakeError { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }

  .card { background: var(--verdecl); border-radius: 24px; width: 100%; max-width: 480px; padding: 28px 24px 24px; box-sizing: border-box; box-shadow: 0 10px 28px rgba(0,0,0,0.4); }
  .logo-wrap img { width: 88px; height: auto; display: block; margin: 0 auto 0px; filter: drop-shadow(0 4px 7px rgba(0,0,0,0.2)); }
  h1 { margin: 2px 0 4px; color: var(--negro); font-family: Impact, sans-serif; font-size: 28px; line-height: 1; letter-spacing: 1px; text-transform: uppercase; text-align: center; }
  .subtitle { text-align: center; color: var(--petroleo); font-size: 14px; margin-bottom: 20px; }

  #pinScreen { display: block; animation: fadeInScreen 0.3s ease-out; }
  #mainScreen { display: none; }
  #mainScreen.active { animation: fadeInScreen 0.3s ease-out; }

  .pin-label { text-align: center; color: var(--petroleo); font-size: 14px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
  .pin-input { display: block; width: 100%; text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 12px; border: 2px solid var(--petroleo); border-radius: 16px; padding: 12px; background: var(--blanco); color: var(--petroleo); outline: none; margin-bottom: 12px; }
  .pin-input.error { animation: shakeError 0.35s ease-in-out; border-color: var(--error); }
  .pin-error { text-align: center; color: var(--error); font-size: 13px; font-weight: 700; min-height: 18px; margin-bottom: 8px; }

  .btn-solid { display: block; width: 100%; padding: 14px; border-radius: 24px; border: 2px solid var(--petroleo); background: var(--naranja); color: var(--petroleo); font-family: 'Roboto', sans-serif; font-size: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; text-align: center; transition: transform 0.08s, box-shadow 0.08s, opacity 0.15s; }
  .btn-solid:hover { opacity: 0.88; }
  .btn-solid:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(0,0,0,0.25); }

  .btn-outline { display: block; width: 100%; padding: 12px; border-radius: 24px; border: 2px solid var(--petroleo); background: transparent; color: var(--petroleo); font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; text-align: center; transition: transform 0.08s, box-shadow 0.08s, background 0.15s, color 0.15s; }
  .btn-outline:hover { background: var(--petroleo); color: var(--naranja); }
  .btn-outline:active { transform: scale(0.96); }

  .btn-ghost { display: block; width: 100%; padding: 8px 10px 0; border: none; background: transparent; color: var(--petroleo); font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; }

  .field-label { color: var(--petroleo); font-size: 12px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; display: block; }

  .seccion { margin-bottom: 22px; }

  input[type=text].buscador-input { width: 100%; border: 2px solid var(--petroleo); border-radius: 14px; padding: 12px 14px; background: var(--blanco); color: var(--petroleo); font-family: 'Roboto', sans-serif; font-size: 16px; outline: none; margin-bottom: 12px; }
  input[type=text].buscador-input:focus { border-color: var(--naranja); }

  .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--blanco); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; }
  .fila .lote { font-weight: 900; color: var(--petroleo); font-size: 15px; }
  .fila .info { display: flex; flex-direction: column; gap: 2px; }
  .fila .nombre { font-size: 12px; color: var(--petroleo); opacity: 0.75; font-weight: 400; }

  .badge { display: inline-block; font-size: 11px; font-weight: 900; text-transform: uppercase; border-radius: 20px; padding: 4px 10px; background: var(--lima); color: var(--petroleo); border: 2px solid var(--petroleo); margin-left: 8px; }

  .btn-mini { border: 2px solid var(--petroleo); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 900; text-transform: uppercase; font-family: 'Roboto', sans-serif; cursor: pointer; transition: transform 0.08s, opacity 0.15s; white-space: nowrap; }
  .btn-mini:active { transform: scale(0.95); }
  .btn-mini.ocultar { background: var(--petroleo); color: var(--naranja); }
  .btn-mini.mostrar { background: var(--naranja); color: var(--petroleo); }

  .vacio { color: var(--petroleo); opacity: 0.65; font-size: 13px; text-align: center; padding: 10px 0; }
  .divider { border: none; border-top: 1.5px solid #9bb583; margin: 18px 0; }
</style>
</head>

  <h1>Cómo Llegar</h1>
  <div class="subtitle"><strong style="color:var(--negro);">Panel administrador</strong></div>

  <div id="pinScreen">
    <div class="pin-label">Ingresá el PIN</div>
    <input class="pin-input" type="password" inputmode="numeric" maxlength="4" id="pinInput" placeholder="····">
    <div class="pin-error" id="pinError"></div>
    <button type="button" class="btn-solid" onclick="verificarPin()">Ingresar</button>
  </div>

  <div id="mainScreen">
    <div class="seccion">
      <span class="field-label">Ocultos actualmente</span>
      <div id="listaOcultos"><div class="vacio">Cargando…</div></div>
    </div>

    <div class="seccion">
      <span class="field-label">Buscar lote</span>
      <input type="text" class="buscador-input" id="buscarInput" placeholder="Ej: I06" oninput="buscarLote()">
      <div id="listaBusqueda"></div>
    </div>

    <hr class="divider">
    <button type="button" class="btn-ghost" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<script>
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbw3HahM7g5kEJ67KGfmA-PFaFDCu_W0yiCyzkC50lIo_CzyoB9g0D5o_idHIbXYh8RciQ/exec';
  var PIN_GUARDADO = '';

  function verificarPin() {
    var pin = document.getElementById('pinInput').value;
    if (pin === '1112') {
      PIN_GUARDADO = pin;
      document.getElementById('pinScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';
      document.getElementById('mainScreen').classList.add('active');
      document.getElementById('pinError').innerText = '';
      cargarOcultos();
    } else {
      document.getElementById('pinError').innerText = 'PIN incorrecto. Intentá de nuevo.';
      document.getElementById('pinInput').value = '';
      var pinEl = document.getElementById('pinInput');
      pinEl.classList.add('error');
      setTimeout(function(){ pinEl.classList.remove('error'); }, 400);
    }
  }
  document.getElementById('pinInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') verificarPin(); });

  function cerrarSesion() {
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('mainScreen').classList.remove('active');
    document.getElementById('pinScreen').style.display = 'block';
    document.getElementById('pinInput').value = '';
  }

  function jsonp(params, callback) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    window[cbName] = function(data) {
      callback(data);
      delete window[cbName];
      script.remove();
    };
    var qs = Object.keys(params).map(function(k){
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var script = document.createElement('script');
    script.src = EXEC_URL + '?' + qs + '&callback=' + cbName;
    document.body.appendChild(script);
  }

  function cargarOcultos() {
    jsonp({ action: 'listarOcultos' }, function(res) {
      var cont = document.getElementById('listaOcultos');
      if (!res.ok) { cont.innerHTML = '<div class="vacio">Error al cargar</div>'; return; }
      if (res.data.length === 0) { cont.innerHTML = '<div class="vacio">No hay lotes ocultos</div>'; return; }
      cont.innerHTML = '';
      res.data.forEach(function(item) {
        var fila = document.createElement('div');
        fila.className = 'fila';
        var nombreHtml = item.nombre ? '<span class="nombre">' + item.nombre + '</span>' : '';
        fila.innerHTML = '<span class="info"><span class="lote">' + item.lote + '<span class="badge">oculto</span></span>' + nombreHtml + '</span>' +
          '<button class="btn-mini mostrar" onclick="mostrarLote(\'' + item.lote + '\')">Volver a mostrar</button>';
        cont.appendChild(fila);
      });
    });
  }

  var timeoutBusqueda;
  function buscarLote() {
    clearTimeout(timeoutBusqueda);
    var q = document.getElementById('buscarInput').value.trim();
    var cont = document.getElementById('listaBusqueda');
    if (!q) { cont.innerHTML = ''; return; }
    timeoutBusqueda = setTimeout(function() {
      jsonp({ action: 'buscarLote', q: q }, function(res) {
        cont.innerHTML = '';
        if (!res.ok || res.data.length === 0) {
          cont.innerHTML = '<div class="vacio">Sin resultados</div>';
          return;
        }
        res.data.forEach(function(item) {
          var fila = document.createElement('div');
          fila.className = 'fila';
          var badge = item.oculto ? '<span class="badge">oculto</span>' : '';
          var boton = item.oculto
            ? '<button class="btn-mini mostrar" onclick="mostrarLote(\'' + item.lote + '\')">Volver a mostrar</button>'
            : '<button class="btn-mini ocultar" onclick="ocultarLote(\'' + item.lote + '\')">Ocultar</button>';
          var nombreHtml = item.nombre ? '<span class="nombre">' + item.nombre + '</span>' : '';
          fila.innerHTML = '<span class="info"><span class="lote">' + item.lote + badge + '</span>' + nombreHtml + '</span>' + boton;
          cont.appendChild(fila);
        });
      });
    }, 300);
  }

  function ocultarLote(lote) {
    jsonp({ action: 'ocultar', lote: lote, pin: PIN_GUARDADO }, function(res) {
      cargarOcultos();
      buscarLote();
    });
  }

  function mostrarLote(lote) {
    jsonp({ action: 'mostrar', lote: lote, pin: PIN_GUARDADO }, function(res) {
      cargarOcultos();
      buscarLote();
    });
  }
</script>

</body>
</html>
